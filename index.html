
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d141e">
  <title>辣個牙科世界 Goddenworld</title>
  <style>
    :root {
      --blue: #75a7f4;
      --blue-light: #20314b;
      --ink: #e1e8f3;
      --muted: #a4b3ca;
      --line: #2b3a52;
      --bg: #0d141e;
      --white: #182131;
      --surface: #182131;
      --surface-inset: #111b2a;
      --surface-hover: #24334b;
      --accent-soft: #20314b;
      --accent-text: #b8d2fa;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      max-width: 1240px;
      margin: auto;
      padding: 13px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .brand { min-width: 225px; }
    .brand-name {
      font-size: 20px;
      font-weight: 850;
      letter-spacing: -.5px;
    }
    .brand-en {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      margin-top: 3px;
    }
    .search {
      flex: 1;
      max-width: 480px;
      background: var(--surface-inset);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 14px;
      outline: none;
      min-width: 70px;
    }
    .search:focus { border-color: var(--blue); background: var(--surface); }
    .nav-actions { display: flex; align-items: center; gap: 10px; }
    .topbar .brand { display: none; }
    .nav-actions { margin-left: auto; }
    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-weight: 700;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-light { background: var(--blue-light); color: var(--blue); }
    .page { max-width: 1240px; margin: 24px auto; padding: 0 20px; }
    .hero {
      background: linear-gradient(115deg, #1d2e57, var(--accent-text));
      color: white;
      border-radius: 16px;
      padding: 25px 28px;
      margin-bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .hero h1 { margin: 0 0 9px; font-size: 26px; letter-spacing: -.6px; }
    .hero p { margin: 0; color: #d9e4ff; line-height: 1.7; }
    .hero-tag {
      border: 1px solid #8da9eb;
      color: #f2f6ff;
      border-radius: 99px;
      padding: 9px 13px;
      white-space: nowrap;
    }
    .layout {
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr) 265px;
      gap: 20px;
      align-items: start;
    }
    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 13px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .panel-title {
      padding: 16px 17px 12px;
      font-weight: 800;
      font-size: 15px;
    }
    .panel-body { padding: 0 15px 16px; }
    .section-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      padding: 10px 17px 7px;
    }
    .board-list { padding: 0 8px 10px; }
    .board {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 9px;
      border-radius: 9px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .board:hover, .board.active { background: var(--blue-light); color: var(--blue); }
    .board-icon {
      width: 30px; height: 30px; display: grid; place-items: center;
      border-radius: 9px; background: var(--surface-inset); font-weight: 850;
      color: var(--muted); flex-shrink: 0;
    }
    .board.active .board-icon { background: var(--accent-soft); color: var(--blue); }
    .board-name { font-weight: 650; }
    .board-count { margin-left: auto; font-size: 11px; color: var(--muted); }
    .small-note { font-size: 12px; line-height: 1.7; color: var(--muted); }
    .compose {
      padding: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
      background: var(--accent-soft); color: var(--accent-text); font-weight: 850;
    }
    .compose-fake {
      flex: 1; text-align: left; border: 1px solid var(--line);
      background: var(--surface-inset); color: var(--muted); padding: 11px;
      border-radius: 9px;
    }
    .feed-tabs {
      display: flex; gap: 23px; align-items: center;
      border-bottom: 1px solid var(--line); padding: 0 16px;
      background: var(--surface); border-radius: 13px 13px 0 0;
    }
    .feed-tab {
      padding: 16px 0 13px; color: var(--muted);
      border: 0; border-bottom: 3px solid transparent; background: none;
      font-weight: 700;
    }
    .feed-tab.active { color: var(--blue); border-bottom-color: var(--blue); }
    .feed-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 17px; background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .feed-head strong { font-size: 15px; }
    .feed-head span { color: var(--muted); font-size: 12px; }
    .post {
      padding: 17px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      transition: background .15s;
    }
    .post:hover { background: var(--surface-hover); }
    .post:last-child { border-bottom: 0; }
    .post-meta { display: flex; align-items: center; gap: 9px; }
    .post-meta .avatar { width: 34px; height: 34px; font-size: 12px; }
    .author { font-weight: 750; font-size: 13px; }
    .verified { color: var(--blue); font-size: 12px; }
    .meta-sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .level {
      background: var(--surface-inset); color: var(--muted); border-radius: 5px;
      padding: 3px 5px; font-size: 10px; font-weight: 800;
    }
    .tag {
      margin-left: auto; background: var(--surface-inset); color: var(--muted);
      border-radius: 5px; padding: 5px 7px; font-size: 11px;
      white-space: nowrap;
    }
    .post h2 { font-size: 16px; line-height: 1.55; margin: 13px 0 7px; }
    .post p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
    .post-actions {
      display: flex; align-items: center; gap: 16px; margin-top: 14px;
      color: var(--muted); font-size: 12px;
    }
    .post-actions button {
      border: 0; background: none; padding: 0; color: inherit;
    }
    .post-actions button:hover { color: var(--blue); }
    .post-actions .liked { color: #f38ca1; }
    .hot-number {
      width: 23px; height: 23px; display: grid; place-items: center;
      border-radius: 6px; background: var(--surface-inset); color: var(--muted);
      font-size: 11px; font-weight: 800; flex-shrink: 0;
    }
    .hot-list { list-style: none; margin: 0; padding: 0 15px 15px; }
    .hot-list li { display: flex; align-items: flex-start; gap: 9px; margin-top: 13px; }
    .hot-list a { font-size: 12px; line-height: 1.65; font-weight: 650; }
    .hot-list a:hover { color: var(--blue); }
    .member-level {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface-inset); border-radius: 10px; padding: 13px;
    }
    .level-badge {
      width: 48px; height: 48px; display: grid; place-items: center;
      border-radius: 12px; background: var(--accent-soft); color: var(--accent-text);
      font-weight: 900; font-size: 20px;
    }
    .member-name { font-weight: 800; }
    .member-sub { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .progress { height: 6px; border-radius: 99px; background: var(--surface-inset); margin: 13px 0 8px; overflow: hidden; }
    .progress-fill { width: 72%; height: 100%; background: var(--blue); border-radius: inherit; }
    .full-btn { width: 100%; margin-top: 12px; }
    .rule { background: var(--surface); border: 1px solid var(--line); color: var(--muted); padding: 13px; border-radius: 9px; line-height: 1.8; font-size: 12px; }
    .notice { background: var(--surface-inset); border: 1px solid var(--line); padding: 14px; border-radius: 10px; }
    .notice strong { display: block; margin-bottom: 7px; }
    .notice p { margin: 0; line-height: 1.7; font-size: 12px; color: var(--muted); }
    .footer { text-align: center; padding: 28px 10px; color: var(--muted); font-size: 11px; line-height: 1.8; }
    .empty { display: none; background: var(--surface); padding: 30px 15px; text-align: center; color: var(--muted); }
    .site-dialog {
      width: min(440px, calc(100% - 32px));
      max-height: calc(100% - 32px);
      padding: 22px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
    }
    .site-dialog::backdrop { background: rgb(36 41 54 / 50%); }
    .site-dialog h2 { margin: 0; font-size: 20px; }
    .dialog-head, .dialog-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .dialog-head { justify-content: space-between; margin-bottom: 14px; }
    .dialog-form { display: grid; gap: 12px; }
    .dialog-form[hidden] { display: none; }
    .dialog-form label { display: grid; gap: 5px; font-weight: 700; }
    .dialog-form input, .dialog-form select, .dialog-form textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .dialog-form textarea { resize: vertical; }
    .dialog-message { margin: 0; line-height: 1.5; overflow-wrap: anywhere; }
    .forum-comment { white-space: pre-wrap; overflow-wrap: anywhere; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .post-actions [aria-pressed="true"] { color: var(--blue); font-weight: 700; }
    .dialog-message:empty { display: none; }
    .member-post p { white-space: pre-wrap; overflow-wrap: anywhere; }
    .member-post h2 { overflow-wrap: anywhere; }
    .sidebar {
      position: sticky;
      top: 78px;
      max-height: calc(100dvh - 94px);
      overflow: auto;
      padding: 17px 14px 16px;
      background: transparent;
      border-radius: 18px;
      color: var(--ink);
    }
    .sidebar-brand {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 3px 5px;
      margin-bottom: 24px;
      color: var(--ink);
    }
    .sidebar-brand svg { width: 35px; height: 35px; color: var(--blue); flex: none; }
    .sidebar-brand strong { display: block; font-size: 20px; font-weight: 850; line-height: 1.2; }
    .sidebar-brand small { display: block; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .7px; }
    .sidebar-nav { display: grid; gap: 4px; }
    .sidebar-item {
      display: flex;
      position: relative;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 46px;
      padding: 9px 13px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      color: inherit;
      text-align: left;
      font-size: 17px;
    }
    .sidebar-item svg { width: 23px; height: 23px; flex: none; }
    .sidebar-item:not(:disabled):hover { background: var(--surface-hover); }
    .sidebar-item[aria-current="true"] {
      background: var(--surface);
      color: var(--accent-text);
      font-weight: 750;
      box-shadow: 0 5px 17px rgb(24 54 96 / 10%);
    }
    .sidebar-item:disabled { cursor: default; color: var(--muted); }
    .sidebar-item small { margin-left: auto; font-size: 10px; }
    .sidebar-badge {
      position: absolute;
      top: 5px;
      left: 27px;
      min-width: 17px;
      padding: 2px 3px;
      border-radius: 99px;
      background: #ec8088;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      line-height: 13px;
      text-align: center;
    }
    .sidebar-write {
      margin-top: 15px;
      width: 100%;
      border-radius: 99px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
    }
    .sidebar-write:hover { background: var(--accent-text); }
    .nav-page h1 { margin: 3px 0 17px; font-size: 25px; color: var(--ink); }
    .nav-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
    .nav-card h2 { margin: 0 0 12px; font-size: 17px; }
    .nav-card p { margin: 7px 0; }
    .nav-card > .btn { margin: 3px 6px 3px 0; }
    .nav-details summary { cursor: pointer; font-size: 16px; font-weight: 750; }
    .nav-details[open] summary { margin-bottom: 12px; }
    .nav-chip-list, .nav-history-row, .nav-search { display: flex; align-items: center; gap: 8px; }
    .nav-chip-list { flex-wrap: wrap; }
    .nav-history-row { justify-content: space-between; margin-bottom: 6px; }
    .nav-search .search { max-width: none; min-width: 0; }
    .nav-ranked { padding-left: 22px; }
    .nav-ranked li { margin-bottom: 5px; }
    .nav-ranked .btn { text-align: left; margin-right: 8px; }
    .nav-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }
    #homeView, #navPage, .member-post { scroll-margin-top: 130px; }
    .center-col { scroll-margin-top: 125px; }
    @media (max-width: 1000px) {
      .layout { grid-template-columns: 220px minmax(0,1fr); }
      .right-col { display: none; }
      .brand { min-width: 185px; }
      .nav { gap: 15px; }
    }
    @media (max-width: 650px) {
      .nav { padding: 12px 14px; gap: 10px; flex-wrap: wrap; }
      .brand { min-width: 0; flex: 1; }
      .brand-name { font-size: 17px; }
      .search { order: 3; flex-basis: 100%; max-width: none; }
      .topbar .brand { display: block; }
      .nav-actions { gap: 6px; }
      .nav-actions .btn { padding: 9px 11px; }
      .sidebar { position: static; max-height: none; padding: 10px; }
      .sidebar-brand { display: none; }
      .sidebar-nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .sidebar-item { flex-direction: column; justify-content: center; gap: 3px; padding: 6px 3px; text-align: center; font-size: 13px; }
      .sidebar-item svg { width: 21px; height: 21px; }
      .sidebar-item small { margin-left: 0; }
      .sidebar-badge { left: calc(50% + 3px); }
      .sidebar-write { margin-top: 9px; }

      .page { margin: 14px auto; padding: 0 12px; }
      .hero { padding: 21px 18px; }
      .hero h1 { font-size: 22px; }
      .hero-tag { display: none; }
      .layout { display: block; }
      .left-col { margin-bottom: 15px; }
      .left-col .board-list { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; }
      .left-col .section-label { padding-top: 12px; }
      .board { flex-shrink: 0; padding: 7px; }
      .board-name { white-space: nowrap; font-size: 12px; }
      .board-icon { width: 27px; height: 27px; }

      .post { padding: 14px; }
      .post h2 { font-size: 15px; }
      .feed-tabs { gap: 20px; }
    }

    /* Shared forum surfaces */
    :root {
      --blue: #75a7f4;
      --blue-light: #20314b;
      --ink: #e1e8f3;
      --muted: #a4b3ca;
      --line: #2b3a52;
      --bg: #0d141e;
    }
    .layout > * { min-width: 0; }
    .topbar { background: rgb(13 20 30 / 95%); backdrop-filter: blur(12px); }
    .search { border-color: var(--line); background: var(--surface-inset); }
    button, a, input, textarea, select, summary { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid #71aaf0; outline-offset: 3px; }
    .btn { min-height: 40px; transition: background .16s, box-shadow .16s; }
    .btn:disabled { cursor: wait; opacity: .65; }
    .btn-light:hover { background: var(--surface-hover); }
    .hero { background: var(--surface); padding: 25px; gap: 14px; }
    .hero h1 { font-size: clamp(21px, 2vw, 27px); line-height: 1.4; }
    .hero-tag { white-space: normal; line-height: 1.6; font-size: 12px; max-width: 140px; }
    .sidebar { scrollbar-width: thin; }
    .sidebar-brand strong { white-space: nowrap; font-size: 19px; }
    .sidebar-write { min-height: 46px; box-shadow: 0 5px 14px rgb(43 130 232 / 15%); }
    .panel, .nav-card { border-color: var(--line); box-shadow: 0 3px 12px rgb(28 60 101 / 3%); }
    .right-col .panel-title { font-size: 14px; }
    .right-col .rule { border-radius: 11px; }
    #homeView > .panel { background: transparent; border: 0; box-shadow: none; overflow: visible; }
    .feed-tabs { gap: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px 14px 0 0; overflow: hidden; }
    .feed-tab { flex: 1; min-height: 51px; }
    .feed-head { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 14px 14px; margin-bottom: 12px; }
    #feedMessage:not(:empty) { padding: 12px 15px; background: var(--surface); border-radius: 12px; margin-bottom: 12px; }
    .post { border: 1px solid var(--line); border-radius: 15px; margin-bottom: 12px; padding: 20px; box-shadow: 0 3px 12px rgb(28 60 101 / 3%); }
    .post:last-child { border-bottom: 1px solid var(--line); }
    .post:hover { background: var(--surface); border-color: var(--blue); }
    .post h2 { font-size: 18px; line-height: 1.6; margin: 12px 0 8px; }
    .post p { color: var(--muted); line-height: 1.9; margin: 8px 0 15px; }
    .post-author { display: flex; align-items: center; gap: 9px; min-height: 40px; }
    .post-author > .btn { background: transparent; color: var(--ink); padding: 5px 0; text-align: left; }
    .post-author > .btn:hover { color: var(--blue); }
    .author-initial { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--blue); font-weight: 750; flex: none; }
    .post .meta-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .post-actions { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
    .post-actions .btn { font-size: 12px; padding: 7px 10px; min-height: 34px; }
    .empty { border: 1px dashed var(--line); border-radius: 14px; padding: 38px 20px; line-height: 1.8; }
    .board-card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .board-tile { display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 13px; background: var(--surface); color: var(--ink); min-height: 76px; }
    .board-tile:hover { border-color: var(--blue); background: var(--surface-hover); }
    .board-tile-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--blue); font-weight: 800; font-size: 17px; flex: none; }
    .board-tile-copy { display: grid; gap: 4px; min-width: 0; }
    .board-tile-copy strong { line-height: 1.5; font-size: 14px; overflow-wrap: anywhere; }
    .board-tile-copy small { color: var(--muted); font-size: 11px; font-weight: 400; }
    .nav-details { padding: 17px; }
    .nav-details summary { line-height: 1.6; }
    .nav-page > h1 { font-size: 25px; margin-bottom: 18px; }
    .nav-search { padding: 12px; }
    .nav-history-row > .btn:first-child { text-align: left; overflow-wrap: anywhere; min-width: 0; }
    .profile-overview > img { border: 4px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
    .profile-overview > h2 { font-size: 23px; margin-top: 4px; }
    .profile-overview > .nav-card { background: var(--surface-inset); box-shadow: none; margin-top: 20px; }
    .site-dialog { box-shadow: 0 22px 70px rgb(18 40 72 / 25%); }
    .dialog-form input, .dialog-form textarea, .dialog-form select { background: var(--surface-inset); min-height: 44px; }
    .dialog-message:not(:empty) { line-height: 1.8; padding-top: 10px; }
    @media (max-width: 650px) {
      .sidebar-nav { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
      .sidebar { padding: 4px 0 12px; }
      .sidebar-item { min-height: 57px; font-size: 11px; border-radius: 10px; }
      .sidebar-item svg { width: 20px; height: 20px; }
      .sidebar-brand { display: none; }
      .sidebar-write { min-height: 42px; font-size: 14px; margin-top: 8px; }
      .topbar .nav { gap: 8px; }
      .hero { padding: 20px; margin-bottom: 15px; }
      .post { padding: 16px; }
      .post h2 { font-size: 17px; }
      .nav-search { flex-wrap: wrap; }
      .nav-search .search { order: 0; flex-basis: auto; flex: 1; }
      .nav-search > .btn { flex: none; }
      .board-card-grid { gap: 7px; }
      .board-tile { padding: 10px; gap: 7px; }
      .board-tile-icon { width: 30px; height: 30px; font-size: 14px; }
      .board-tile-copy strong { font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    .hero { border: 1px solid var(--line); color: var(--ink); }
    .hero p, .hero-tag { color: var(--muted); }
    .hero-tag { border-color: var(--line); }
    .btn-primary, .sidebar-write { color: #0e203b; }
    .btn-primary:hover, .sidebar-write:hover { background: #93bafa; color: #0e203b; }
    .sidebar-badge { color: #17202d; }
    .sidebar-item[aria-current="true"] { color: var(--accent-text); background: var(--surface); }
    .sidebar-brand, .sidebar { color: var(--ink); }
    .site-dialog { background: var(--surface); }
    .site-dialog::backdrop { background: rgb(0 0 0 / 68%); }

    function filterPosts() {
      const keyword = searchInput.value.trim().toLowerCase();
      let shown = 0;
      postList.querySelectorAll(".post").forEach(post => {
        const matchesCategory = selectedCategory === "全部" || post.dataset.category === selectedCategory;
        const matchesKeyword = (post.dataset.title + " " + post.innerText).toLowerCase().includes(keyword);

        post.style.display = visible ? "" : "none";
        if (visible) shown++;
      });
      emptyState.style.display = shown ? "none" : "block";
      postCount.textContent = shown + " 篇文章";

    const navPage = document.getElementById('navPage');

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://qnlqnocmjfhjhsryzviw.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_w-WB-MFrnBY5il0LsxlSgg_6XPRHBtJ';

  const supabaseClient = window.supabase?.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const loginBtn = document.getElementById('loginBtn');
  const authDialog = document.getElementById('authDialog');
  const authForm = document.getElementById('authForm');
  const authMessage = document.getElementById('authMessage');
  const authSubmit = document.getElementById('authSubmit');
  const authSwitch = document.getElementById('authSwitch');
  const authTitle = document.getElementById('authTitle');
  const passwordField = authForm.elements.password;
  const accountActions = document.getElementById('accountActions');
  const signOutBtn = document.getElementById('signOutBtn');
  const writeDialog = document.getElementById('writeDialog');
  const writeForm = document.getElementById('writeForm');
  const writeMessage = document.getElementById('writeMessage');
  const publishBtn = document.getElementById('publishBtn');
  const feedMessage = document.getElementById('feedMessage');
  let currentUser = null;
  let registering = false;
  let writeAfterLogin = false;
  let postLoadVersion = 0;

  function updateAuthDialog() {
    loginBtn.textContent = currentUser ? '會員帳號' : '登入／註冊';
    authForm.hidden = Boolean(currentUser);
    accountActions.hidden = !currentUser;
    authTitle.textContent = currentUser ? '會員帳號' : registering ? '建立帳號' : '會員登入';
    authSubmit.textContent = registering ? '註冊' : '登入';
    authSwitch.textContent = registering ? '返回登入' : '建立帳號';
    passwordField.autocomplete = registering ? 'new-password' : 'current-password';
  }

  function showAuth(message = '') {
    registering = false;
    updateAuthDialog();
    authMessage.textContent = supabaseClient ? message : '會員服務載入失敗，請重新整理頁面。';
    if (!authDialog.open) authDialog.showModal();
  }

  loginBtn.addEventListener('click', () => {
    writeAfterLogin = false;
    showAuth();
  });
  authSwitch.addEventListener('click', () => {
    registering = !registering;
    passwordField.value = '';
    authMessage.textContent = '';
    updateAuthDialog();
  });
  authDialog.addEventListener('close', () => {
    passwordField.value = '';
  });
  supabaseClient?.auth.onAuthStateChange((_event, session) => {
    currentUser = session?.user ?? null;
    updateAuthDialog();
    setTimeout(() => refreshMembership(session?.user?.id), 0);
  });

  authForm.addEventListener('submit', async event => {
    event.preventDefault();
    if (!supabaseClient || authSubmit.disabled) return;
    const email = authForm.elements.email.value.trim();
    const password = passwordField.value;
    const isSignUp = registering;
    authSubmit.disabled = true;
    authSwitch.disabled = true;
    authMessage.textContent = '處理中…';
    try {
      const { data, error } = isSignUp
        ? await supabaseClient.auth.signUp({
            email,
            password,
            options: { emailRedirectTo: new URL(location.pathname, location.origin).href }
          })
        : await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const messages = {
          invalid_credentials: '電子郵件或密碼有誤。',
          email_not_confirmed: '請先開啟驗證信完成驗證，再登入。',
          weak_password: '請使用更長或更強的密碼。',
          over_email_send_rate_limit: '驗證信寄送太頻繁，請稍後再試。'
        };
        authMessage.textContent = messages[error.code] || '無法完成操作，請確認資料或稍後再試。';
        return;
      }
      if (data.session) {
        const openWriter = writeAfterLogin && authDialog.open;
        writeAfterLogin = false;
        authDialog.close();
        if (openWriter) {
          await Promise.all([refreshMembership(data.session.user.id), initialBoardLoad]);
          openWriterForMember();
        }
      } else {
        registering = false;
        passwordField.value = '';
        updateAuthDialog();
        authMessage.textContent = '請查收驗證信，完成電子郵件驗證後即可登入。';
      }
    } catch {
      authMessage.textContent = '連線失敗，請稍後再試。';
    } finally {
      authSubmit.disabled = false;
      authSwitch.disabled = false;
    }
  });

  signOutBtn.addEventListener('click', async () => {
    signOutBtn.disabled = true;
    try {
      const { error } = await supabaseClient.auth.signOut({ scope: 'local' });
      if (error) throw error;
      authDialog.close();
    } catch {
      authMessage.textContent = '登出失敗，請稍後再試。';
    } finally {
      signOutBtn.disabled = false;
    }
  });

  const labels = ['訪客／待驗證', '一般會員', '進階會員', '版主', '管理員'];
  const restrictedBoards = new Set(['徵人／徵工作', '團購', '二手／買賣']);
  let feedPosts = [];
  let boards = [];
  const boardLabels = new Map();
  let initialBoardLoad;

  function boardLabel(key) {
    return boardLabels.get(key) ?? key;
  }

  function updateFeedTitle() {
    document.getElementById('feedTitle').textContent = selectedFeed === '追蹤' ? '追蹤中的文章'
      : selectedCategory !== '全部' ? boardLabel(selectedCategory) : selectedFeed === '全部' ? '全部文章' : '最新討論';
  }

  async function loadBoardLabels() {
    const { data, error } = await supabaseClient.from('forum_boards')
      .select('board_key,label,archived').order('sort_order').order('label');
    if (error) throw error;
    boardLabels.clear();
    data.forEach(row => boardLabels.set(row.board_key, row.label));
    boards = data.filter(row => !row.archived).map(row => row.board_key);
    if (!boards.includes(selectedCategory)) selectedCategory = '全部';
    updateFeedTitle();
  }
  const forumDialog = document.getElementById('forumDialog');
  const forumContent = document.getElementById('forumContent');
  const forumMessage = document.getElementById('forumMessage');
  let accessLevel = 0;
  let membershipUserId;
  let membershipRequest;
  let editingPost = null;
let memberActions = new Set();
let memberCommentActions = new Set();
  function element(tag, text, className) {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function showForum(title) {
    authDialog.close();
    document.getElementById('forumTitle').textContent = title;
    forumContent.replaceChildren();
    forumMessage.textContent = '';
    if (!forumDialog.open) forumDialog.showModal();
  }

  function requireMember() {
    if (accessLevel >= 1) return true;
    if (currentUser) {
      feedMessage.textContent = '目前無法使用會員功能，請確認電子郵件已驗證後重新登入。';
    } else {
      showAuth('請先登入以使用會員功能。');
    }
    return false;
  }

  function action(label, handler) {
    const button = element('button', label, 'btn btn-light');
    button.type = 'button';
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        await handler();
      } catch (error) {
        const target = forumDialog.open ? forumMessage : navPage.hidden ? feedMessage
          : navPage.querySelector('[role="status"]');
        target.textContent = error.code === '42501' ? '目前帳號沒有這項權限。' : '操作失敗，請稍後再試。';
      } finally {
        button.disabled = false;
      }
    });
    return button;
  }

  function showPermissions() {
    showForum('會員權限');
    for (const text of [
      '訪客可瀏覽、搜尋公開文章。',
      'Email 驗證後可在一般看板發文、留言、按讚、追蹤和檢舉。',
      '進階會員由站方人工審核，可在' + [...restrictedBoards].map(boardLabel).join('、') + '看板發文。',
      '版主可處理檢舉和下架文章。',
      '管理員可設定會員等級、指派版主、刪除文章及新增、修改、刪除探索看板。'
    ]) forumContent.append(element('p', text));
  }

  document.getElementById('levelBtn').addEventListener('click', showPermissions);
  document.getElementById('accountPermissions').addEventListener('click', showPermissions);

  function updateMembership() {
    const label = currentUser ? labels[accessLevel] : '訪客';
    document.getElementById('levelSummary').textContent = label;
    document.getElementById('accountLevel').textContent = label;
    document.getElementById('moderationBtn').hidden = accessLevel < 3;
    for (const id of ['memberAdminBtn', 'boardAdminBtn', 'hiddenPostsBtn']) {
      document.getElementById(id).hidden = accessLevel < 4;
    }
  }

  
function refreshMembership(userId) {
    if (membershipUserId === userId && membershipRequest) return membershipRequest;

    membershipUserId = userId;
    if (activeNav === 'cardsNav') {
      cardPageVersion++;
      navPage.replaceChildren(element('p', '正在更新會員狀態…', 'small-note'));
    }
    accessLevel = 0;
    profileCompleted = false;

    document.getElementById('noticeBadge').hidden = true;
    document.getElementById('noticeBtn').removeAttribute('aria-label');
    memberActions = new Set();
    updateMembership();

    if (!userId && selectedFeed === '追蹤') {
      document.querySelector('.feed-tab[data-feed="全部"]').click();
    }

    membershipRequest = (async () => {
      try {
        if (userId) {
          const { data, error } = await supabaseClient.rpc('forum_access_level');
          if (error) throw error;
          if (currentUser?.id !== userId) return;

          accessLevel = data;
          updateMembership();
          refreshNoticeBadge();

          if (accessLevel >= 1) {
            const { data: profile, error: profileError } = await supabaseClient
              .from('profiles')
              .select('profile_completed_at')
              .eq('id', userId)
              .maybeSingle();

            if (profileError) throw profileError;
            if (currentUser?.id !== userId) return;

                        profileCompleted = Boolean(profile?.profile_completed_at);

            if (!profileCompleted) {
              openCompleteProfilePage();
              return;
            }

            const { data: dailyReward, error: dailyRewardError } =
              await supabaseClient.rpc('claim_daily_login_experience');

            if (dailyRewardError) throw dailyRewardError;

            if (currentUser?.id !== userId) return;
          }
        }

        await loadMemberPosts();

        if (activeNav === 'profileNav') openProfilePage();
        if (activeNav === 'cardsNav') openCardsPage();
        if (activeNav === 'noticeBtn') openNotificationsPage();

      } catch {
        if (currentUser?.id === userId) {
          feedMessage.textContent = '會員或文章資料暫時無法載入，請重新整理。';
        }
      }
    })();

    return membershipRequest;
  }


  function openWriterForMember(post = null) {
    if (!requireMember()) return;
    editingPost = post;
    writeForm.reset();
    const options = boards.filter(board => accessLevel >= 2 || !restrictedBoards.has(board));
    if (post && !boards.includes(post.board)) options.unshift(post.board);
    if (!options.length) {
      feedMessage.textContent = '目前沒有可發文的看板。';
      return;

async function loadMemberPosts() {
    const version = ++postLoadVersion;
    const reads = [
      supabaseClient.from('posts')
        .select('id,user_id,title,body,board,created_at,comments(count)')
        .is('hidden_at', null)
        .order('created_at', { ascending: false })
        .order('id', { ascending: false })
    ];

    if (accessLevel >= 1) {
      reads.push(
        supabaseClient.from('forum_post_actions').select('post_id,kind')
      );
    }

    const [posts, actions] = await Promise.all(reads);

    if (version !== postLoadVersion) return;
    if (posts.error || actions?.error) {
      throw posts.error || actions.error;
    }

    memberActions = new Set(
      actions?.data.map(item => item.post_id + ':' + item.kind)
    );

    feedPosts = posts.data || [];

    const userIds = [
      ...new Set(feedPosts.map(post => post.user_id).filter(Boolean))
    ];

    if (userIds.length) {
      const { data: profiles, error: profileError } = await supabaseClient
        .from('profiles')
        .select('id,display_name,avatar_url')
        .in('id', userIds);

      if (!profileError) {
        const profileMap = new Map(
          profiles.map(profile => [profile.id, profile])
        );

        feedPosts = feedPosts.map(post => ({
          ...post,
          authorProfile: profileMap.get(post.user_id) || null
        }));
      }
    }

    if (version !== postLoadVersion) return;

    postList.replaceChildren(...feedPosts.map(renderPost));
    filterPosts();
  }

function appendForumForm(label, buttonText, length, handler) {
    const form = element('form', '', 'dialog-form');
    const fieldLabel = element('label', label);
    const input = element('textarea', '');
    input.required = true;
    input.maxLength = length;
    input.rows = 3;
    fieldLabel.append(input);
    const button = element('button', buttonText, 'btn btn-primary');
    form.append(fieldLabel, button);
    forumContent.append(form);
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value || button.disabled) return;
      button.disabled = true;
      forumMessage.textContent = '';
      try { await handler(value); input.value = ''; }
      catch (error) { forumMessage.textContent = error.code === '23505' ? '你已檢舉過這篇文章。' : '送出失敗，請稍後再試。'; }
      finally { button.disabled = false; }
    });
  }

      const key = boardSelect.value;
      const previous = boardLabel(key);
      const label = name.value.trim();
      if (operation !== 'delete' && (!label || (key && label === previous))) return;
      if (operation === 'delete' &&

      for (const field of [save, remove, boardSelect, name]) field.disabled = true;
      forumMessage.textContent = '';
      try {
        const table = supabaseClient.from('forum_boards');
        const request = !key ? table.insert({ label }) :
          table.update(operation === 'delete' ? { archived: true } : { label })
            .eq('board_key', key).eq('label', previous).eq('archived', false);
        const { data, error } = await request.select('board_key');

        await loadBoardLabels();

        forumMessage.textContent = error.code === '23505' ? '這個名稱已被其他看板使用。'

      } finally {
        for (const field of [save, remove, boardSelect, name]) field.disabled = false;
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      return saveBoard('save');
    });
    remove.addEventListener('click', () => saveBoard('delete'));

  function historyValues(key) {
    try {
      const data = JSON.parse(localStorage.getItem(key));
      return Array.isArray(data) ? data.filter(value => typeof value === 'string').slice(0, 6) : [];
    } catch {
      return [];
    }
  }

  function saveHistory(key, values) {
    try { localStorage.setItem(key, JSON.stringify(values.slice(0, 6))); }
    catch { /* Browsing works when browser storage is unavailable. */ }
  }

  function remember(key, value) {
    saveHistory(key, [value, ...historyValues(key).filter(item => item !== value)]);
  }

    remember('forum-recent-boards', key);
    showFeed(key, 'boardsNav');

      if (date.getTime() >= cutoff && boards.includes(post.board)) activity.set(post.board, (activity.get(post.board) ?? 0) + 1);
      if (date.getFullYear() === now.getFullYear() && date.getMonth() === now.getMonth() && post.comments?.[0]?.count > 0) monthly.push(post);
    }
    const hot = [...activity].sort((a, b) => b[1] - a[1]).slice(0, 5).map(([key]) => key);
    const top = element('ol', '', 'nav-ranked');
    for (const post of monthly.sort((a, b) => b.comments[0].count - a.comments[0].count).slice(0, 10)) {
      const item = element('li', '');
      item.append(action(post.title, () => openPost(post)), element('span', post.comments[0].count + ' 則留言', 'small-note'));
      top.append(item);
    }
    page.append(
      expandable('所有看板', boardOptions(boards), true),
      expandable('即時熱門看板', hot.length ? boardOptions(hot) : element('p', '近七天尚無看板發文。', 'small-note')),

      recent
    );
  }

  function openSearchPage(query = '', focus = true) {
    const page = openNavPage('searchNav', '搜尋');
    const form = element('form', '', 'nav-card nav-search');
    const input = element('input', '', 'search');
    input.type = 'search';
    input.placeholder = '搜尋文章、看板或關鍵字';
    input.setAttribute('aria-label', '搜尋文章或看板');
    input.value = query;
    const submit = element('button', '搜尋', 'btn btn-primary');
    submit.type = 'submit';
    form.append(input, submit);
    const content = element('div', '');
    page.append(form, content);

    function render(query) {
      const value = query.trim();
      content.replaceChildren();
      if (value) {
        const term = value.toLowerCase();
        const matchedBoards = boards.filter(key => boardLabel(key).toLowerCase().includes(term));
        const matchedPosts = feedPosts.filter(post => [post.title, post.body, boardLabel(post.board)].join(' ').toLowerCase().includes(term));
        if (matchedBoards.length) {
          const matches = card('符合的看板');
          matches.append(boardOptions(matchedBoards));
          content.append(matches);
        }
        const matches = card('搜尋結果');
        if (matchedPosts.length) matches.append(...matchedPosts.map(post => action(post.title, () => openPost(post))));
        else matches.append(element('p', '沒有找到符合的文章。', 'small-note'));
        content.append(matches);
        return;
      }
      const suggestions = card('搜尋建議');
      const chips = element('div', '', 'nav-chip-list');
      for (const key of boards.slice(0, 8)) chips.append(action(boardLabel(key), () => search(boardLabel(key))));
      suggestions.append(chips);
      const recent = card('最近搜尋紀錄');
      const terms = historyValues('forum-recent-searches');
      for (const term of terms) {
        const row = element('div', '', 'nav-history-row');
        const remove = action('移除', () => {
          saveHistory('forum-recent-searches', terms.filter(item => item !== term));
          render('');
        });
        remove.setAttribute('aria-label', '移除搜尋紀錄 ' + term);
        row.append(action(term, () => search(term)), remove);
        recent.append(row);
      }
      if (!terms.length) recent.append(element('p', '目前沒有搜尋紀錄。', 'small-note'));
      content.append(suggestions, recent);
    }

    function search(value) {
      const term = value.trim();
      if (term) remember('forum-recent-searches', term);
      input.value = term;
      render(term);
    }

    form.addEventListener('submit', event => { event.preventDefault(); search(input.value); });
    input.addEventListener('input', () => render(input.value));
    render(query);
    initialBoardLoad?.then(() => {
      if (input.isConnected) render(input.value);
    });
    if (focus) input.focus({ preventScroll: true });
  }

  function createLocationSelects(savedCity = '', savedDistrict = '') {
    const city = element('select', '');
    const district = element('select', '');
    city.required = true;
    district.required = true;
    const rawCity = savedCity.trim();
    const normalizedCity = rawCity.replace(/台/g, '臺');
    const selectedCity = Object.hasOwn(taiwanDistricts, normalizedCity) ? normalizedCity : rawCity;
    const cityNames = Object.keys(taiwanDistricts);
    city.replaceChildren(new Option('請選擇縣市', ''),
      ...cityNames.map(name => new Option(name, name)));
    if (selectedCity && !cityNames.includes(selectedCity)) {
      city.add(new Option(selectedCity + '（原有資料）', selectedCity));
    }
    city.value = selectedCity;

    function updateDistricts(value = '') {
      const names = Object.hasOwn(taiwanDistricts, city.value) ? taiwanDistricts[city.value] : [];
      district.replaceChildren(new Option(city.value ? '請選擇行政區' : '請先選擇縣市', ''),
        ...names.map(name => new Option(name, name)));
      if (value && !names.includes(value)) {
        district.add(new Option(value + '（原有資料）', value));
      }
      district.value = value;
      district.disabled = !city.value;
    }
    updateDistricts(savedDistrict.trim());
    city.addEventListener('change', () => updateDistricts());
    return { city, district };
  }

      avatarLabel,
      occupationLabel,
      cityLabel,
      districtLabel,
      bioLabel,
      submit
    );

    page.append(form);

      event.preventDefault();

      if (submit.disabled || currentUser?.id !== userId) return;

      const displayName = nameInput.value.trim();
      const city = cityInput.value.trim();
      const district = districtInput.value.trim();
      const bio = bioInput.value.trim();
      const avatarFile = avatarInput.files?.[0];

      if (!displayName || !city || !district || !bio ||
          !occupationInput.value || !avatarFile) {
        status.textContent = '請完整填寫所有欄位。';
        return;
      }

      if (!['image/jpeg', 'image/png', 'image/webp'].includes(avatarFile.type)) {
        status.textContent = '頭像僅接受 JPG、PNG 或 WebP 格式。';
        return;
      }

      if (avatarFile.size > 2 * 1024 * 1024) {
        status.textContent = '頭像檔案不可超過 2 MB。';
        return;
      }

      submit.disabled = true;
      status.textContent = '正在儲存個人資料，請稍候……';

      try {
        const extension = {
          'image/jpeg': 'jpg',
          'image/png': 'png',
          'image/webp': 'webp'

        const avatarPath = userId + '/' + crypto.randomUUID() + '.' + extension;

          .storage
          .from('avatars')
          .upload(avatarPath, avatarFile, {
            contentType: avatarFile.type,
            upsert: false
          });

        if (uploadError) throw uploadError;

        const { data: avatarData } = supabaseClient
          .storage
          .from('avatars')
          .getPublicUrl(avatarPath);

        const { error } = await supabaseClient.rpc('complete_my_profile', {
          p_display_name: displayName,
          p_avatar_url: avatarData.publicUrl,
          p_occupation: occupationInput.value,
          p_city: city,
          p_district: district,
          p_bio: bio
        });

        if (currentUser?.id !== userId) return;

        }

      } catch (error) {
        console.error('個人資料儲存失敗：', error);

        if (error.code === '23505') {
          status.textContent = '這個暱稱已有人使用，請更換其他暱稱。';
        } else {
          status.textContent = '個人資料儲存失敗，請稍後再試。';
        }
      } finally {
        submit.disabled = false;
      }
    });
  }

  
function editProfile(userId, name, profileData) {
  showForum('編輯基本資料');

  const form = element('form', '', 'dialog-form');

  function addField(title, control) {
    const label = element('label', title);
    label.append(control);
    form.append(label);
  }

  const displayName = element('input');
  displayName.value = profileData.display_name || '';
  displayName.required = true;
  displayName.maxLength = 40;
  addField('顯示名稱', displayName);

  const avatarInput = element('input');
  avatarInput.type = 'file';
  avatarInput.accept = 'image/*';
  addField('更換頭像', avatarInput);

  const occupation = element('select');
  const occupations = [
    '牙醫師',
    '牙醫助理',
    '牙體技術師',
    '牙科衛生師',
    '牙醫學生',
    '牙材廠商',
    '診所行政／管理人員',
    '其他'
  ];

  occupations.forEach(value => {
    const option = element('option', value);
    option.value = value;
    occupation.append(option);
  });

  occupation.value = profileData.occupation || '';
  occupation.required = true;
  addField('職業身分', occupation);

  const { city, district } = createLocationSelects(profileData.city || '', profileData.district || '');
  addField('縣市', city);
  addField('行政區', district);

  const bio = element('textarea');
  bio.value = profileData.bio || '';
  bio.required = true;
  bio.maxLength = 300;
  addField('個人簡介', bio);

  const save = element('button', '儲存', 'btn btn-primary');
  save.type = 'submit';
  form.append(save);
  forumContent.append(form);

  form.addEventListener('submit', async event => {
    event.preventDefault();

    if (save.disabled || currentUser?.id !== userId) return;

    save.disabled = true;
    forumMessage.textContent = '資料儲存中，請稍候。';

    try {
      let avatarUrl = profileData.avatar_url || '';
      const file = avatarInput.files[0];

      if (file) {
        if (!file.type.startsWith('image/')) {
          throw Error('請選擇圖片檔案');
        }

        const extension = file.name.includes('.')
          ? file.name.split('.').pop().toLowerCase()
          : 'jpg';

        const path = userId + '/' + crypto.randomUUID() + '.' + extension;

        const { error: uploadError } = await supabaseClient
          .storage
          .from('avatars')
          .upload(path, file, {
            contentType: file.type
          });

        if (uploadError) throw uploadError;

        const { data: imageData } = supabaseClient
          .storage
          .from('avatars')
          .getPublicUrl(path);

        avatarUrl = imageData.publicUrl;
      }

      const { data, error } = await supabaseClient.rpc(
        'update_my_profile',
        {
          p_display_name: displayName.value.trim(),
          p_avatar_url: avatarUrl,
          p_occupation: occupation.value,
          p_city: city.value.trim(),
          p_district: district.value.trim(),
          p_bio: bio.value.trim()
        }
      );

      if (error) throw error;
      if (!data) throw Error('Profile update failed');

      profileData.display_name = displayName.value.trim();
      profileData.avatar_url = avatarUrl;
      profileData.occupation = occupation.value;
      profileData.city = city.value.trim();
      profileData.district = district.value.trim();
      profileData.bio = bio.value.trim();

      name.textContent = profileData.display_name;
      forumMessage.textContent = '個人資料已成功更新！';

    } catch (error) {
      console.error('個人資料更新失敗：', error);

      if (error.code === '23505') {
        forumMessage.textContent = '這個顯示名稱已經有人使用，請換一個。';
      } else {
        forumMessage.textContent = error.message || '無法儲存個人資料，請稍後再試。';
      }
    } finally {
      save.disabled = false;
    }
  });
}



  let cardPageVersion = 0;
  let cardActionBusy = false;

  function cardDate(value) {
    return new Date(value).toLocaleString('zh-TW', {
      timeZone: 'Asia/Taipei', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  async function openCardsPage() {
    const version = ++cardPageVersion;
    const page = openNavPage('cardsNav', '抽卡');
    const intro = card('認識牙科圈的新朋友');
    intro.append(element('p', '不限感情狀態與性別，以牙科同行交流為主。台灣時間每天 00:00、12:00 各有一次配對機會。', 'small-note'));
    page.append(intro);
    if (!currentUser) {
      memberPrompt(intro, '登入並完成會員資料後，即可選擇加入。');
      return;
    }
    const userId = currentUser.id;
    const loading = card('正在讀取抽卡資料…');
    page.append(loading);
    try {
      const { data, error } = await supabaseClient.rpc('forum_cards', { action_name: 'load' });
      if (error) throw error;
      if (version !== cardPageVersion || activeNav !== 'cardsNav' || currentUser?.id !== userId) return;
      loading.remove();
      await renderCardsPage(page, data, version, userId);
    } catch (error) {
      if (version !== cardPageVersion || activeNav !== 'cardsNav' || currentUser?.id !== userId) return;
      loading.replaceChildren(element('p', error.code === '22023' ? '請先完成個人資料，包含頭像與簡介，再加入抽卡。'
        : error.code === '42501' ? '請先完成 Email 驗證後重新登入。' : '抽卡資料暫時無法載入，請稍後重新整理。'));
      if (error.code === '22023') loading.append(action('完善個人資料', openCompleteProfilePage));
      else loading.append(action('重新讀取', openCardsPage));
    }
  }

  async function performCardAction(actionName, pairId = null, enabled = null) {
    if (cardActionBusy) return;
    cardActionBusy = true;
    const version = cardPageVersion;
    const userId = currentUser?.id;
    const status = navPage.querySelector('[role="status"]');
    if (status) status.textContent = '處理中…';
    try {
      const { error } = await supabaseClient.rpc('forum_cards', { action_name: actionName, pair_id: pairId, enabled });
      if (error) throw error;
      if (version === cardPageVersion && activeNav === 'cardsNav' && currentUser?.id === userId) await openCardsPage();
    } catch (error) {
      if (version === cardPageVersion && activeNav === 'cardsNav' && currentUser?.id === userId && status) {
        status.textContent = error.code === '42501' ? '目前無權操作，請重新登入。'
          : error.code === '22023' ? error.message : '無法確認操作結果，請按「重新整理」確認。';
      }
    } finally {
      cardActionBusy = false;
    }
  }

  function renderPerson(person) {
    const section = element('div', '', 'draw-person');
    if (/^https?:\/\//i.test(person.avatar_url || '')) {
      const image = element('img', '');
      image.src = person.avatar_url;
      image.alt = person.display_name + '的頭像';
      image.loading = 'lazy';
      image.referrerPolicy = 'no-referrer';
      section.append(image);
    }
    section.append(element('h3', person.display_name || '會員'),
      element('p', [person.occupation, person.city].filter(Boolean).join('・'), 'small-note'),
      element('p', person.bio || '', 'draw-bio'));
    return section;
  }

  function renderDrawCard(pair, participating) {
    const section = card(pair.matched_at ? '卡友' : pair.current ? '本時段的卡片' : '待回應的卡片');
    if (!pair.person || !pair.available) {
      section.append(element('p', '這張卡片目前無法互動。對方可能已略過或暫停參加。', 'small-note'));
      return section;
    }
    section.append(renderPerson(pair.person));
    const controls = element('div', '', 'dialog-actions');
    if (pair.matched_at) {
      section.append(element('p', '你們都選擇了想認識，已成為卡友。私訊功能尚未開放。', 'small-note'));
      controls.append(action('解除卡友', () => {
        if (confirm('確定解除這段卡友關係？')) return performCardAction('end_friend', pair.id);
      }));
    } else {
      section.append(element('p', '卡片期限｜' + cardDate(pair.expires_at), 'small-note'));
      if (pair.choice === 'yes') {
        section.append(element('p', '已送出想認識，等待對方回應。', 'small-note'));
      } else if (participating) {
        const yes = action('想認識', () => performCardAction('respond_yes', pair.id));
        yes.className = 'btn btn-primary';
        controls.append(yes, action('略過', () => {
          if (confirm('確定略過這張卡片？本時段不會另抽一位。')) return performCardAction('respond_skip', pair.id);
        }));
      }
    }
    controls.append(action('封鎖', () => {
      if (confirm('封鎖後會解除卡友及邀請，雙方不再互相配對。')) return performCardAction('block', pair.id);
    }));
    section.append(controls);
    return section;
  }

  async function renderCardsPage(page, data, version, userId) {
    const settings = card('抽卡設定');
    settings.append(element('p', data.enabled ? '目前正在參加' : '目前尚未參加', 'draw-setting'));
    settings.append(element('p', '下個時段｜' + cardDate(data.next_at) + '（台灣時間）', 'small-note'));
    settings.append(action('重新整理', openCardsPage));
    page.append(settings);

    if (data.enabled) {
      settings.append(action('暫停參加', () => {
        if (confirm('暫停後不會獲得新卡片，也暫停未成立邀請。既有卡友仍會保留。')) return performCardAction('join', null, false);
      }));
    } else {
      const preview = card('你的卡片預覽');
      settings.append(element('p', '加入後，配對會員可看到你的頭像、暱稱、職業、縣市與簡介。Email、行政區與感情狀態不會放在卡片上。', 'small-note'));
      page.append(preview);
      try {
        const { data: profile, error } = await supabaseClient.from('profiles')
          .select('display_name,avatar_url,occupation,city,bio').eq('id', userId).maybeSingle();
        if (version !== cardPageVersion || activeNav !== 'cardsNav' || currentUser?.id !== userId) return;
        if (error || !profile) throw error ?? Error('Profile missing');
        preview.append(renderPerson(profile));
        const join = action('同意公開卡片並開始參加', () => performCardAction('join', null, true));
        join.className = 'btn btn-primary';
        preview.append(join);
      } catch {
        preview.append(element('p', '卡片預覽無法載入，請重新整理後再參加。', 'small-note'));
      }
    }

    if (version !== cardPageVersion || activeNav !== 'cardsNav' || currentUser?.id !== userId) return;
    const pending = data.cards.filter(pair => !pair.matched_at);
    const friends = data.cards.filter(pair => pair.matched_at);
    if (data.enabled) {
      if (!pending.some(pair => pair.current)) {
        const waiting = card('本時段等待配對');
        waiting.append(element('p', '目前沒有可配對的會員。請邀請另一位已完成資料的會員加入，再按「重新整理」。每位會員同一時段最多配對一人。', 'small-note'));
        page.append(waiting);
      }
      for (const pair of pending) page.append(renderDrawCard(pair, data.enabled));
    }
    const friendList = card('我的卡友');
    if (!friends.length) friendList.append(element('p', '雙方都選擇「想認識」後，會在這裡看到卡友。', 'small-note'));
    else for (const pair of friends) friendList.append(renderDrawCard(pair, data.enabled));
    page.append(friendList);
    const blocks = card('封鎖名單');
    if (!data.blocks.length) blocks.append(element('p', '目前沒有封鎖紀錄。', 'small-note'));
    for (const blocked of data.blocks) {
      const row = element('div', '', 'nav-history-row');
      row.append(element('span', blocked.display_name), action('解除封鎖', () => performCardAction('unblock', blocked.id)));
      blocks.append(row);
    }
    if (data.blocks.length) blocks.append(element('p', '解除封鎖後，原有邀請與卡友關係仍維持結束。', 'small-note'));
    page.append(blocks);
    const rules = card('配對規則');
    rules.append(element('p', '參加需驗證 Email 並完成個人資料。每個時段配對一位，雙方會互相看見卡片；同一時段重新整理不會換人。邀請保留 7 天，雙方同意才成為卡友。', 'small-note'),
      element('p', '已封鎖、仍是卡友、邀請尚在進行，或最近 7 天配對過的會員，不會再次配對。參加人數不足時可能無法取得卡片。', 'small-note'));
    page.append(rules);
  }

  function openMessagesPage() {
    const page = openNavPage('messagesNav', '私訊');
    const inbox = card('私訊收件匣');
    inbox.append(element('p', '私訊與私訊邀請尚未開放。', 'small-note'));
    page.append(inbox);
  }

  document.getElementById('boardsNav').addEventListener('click', () => {
    openBoardsPage();
    initialBoardLoad?.then(() => {
      if (activeNav === 'boardsNav' && !navPage.hidden) openBoardsPage();
    });
  });
  document.getElementById('searchNav').addEventListener('click', () => openSearchPage());
  document.getElementById('profileNav').addEventListener('click', () => openProfilePage());
  document.getElementById('cardsNav').addEventListener('click', openCardsPage);
  document.getElementById('messagesNav').addEventListener('click', openMessagesPage);

  
async function openNotificationsPage() {
  const page = openNavPage('noticeBtn', '通知');
  const inbox = card('我的通知');
  page.append(inbox);

  if (accessLevel < 1) {
    if (!currentUser) memberPrompt(inbox, '登入後查看回覆與追蹤文章的通知。');
    else inbox.append(element('p', '完成 Email 驗證後即可接收通知。', 'small-note'));
    return;
  }

  refreshNoticeBadge();

  const { data, error } = await supabaseClient
    .from('forum_notifications')
    .select('id,post_id,comment_id,actor_user_id,notification_type,created_at,is_read,posts(title)')
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    inbox.append(element('p', '通知暫時無法載入。', 'small-note'));
    return;
  }

  if (!data.length) {
    inbox.append(element('p', '目前沒有通知。'));
    return;
  }

  const actorIds = [...new Set(
    data.map(notice => notice.actor_user_id).filter(Boolean)
  )];

  let actorMap = new Map();

  if (actorIds.length) {
    const { data: actors, error: actorError } = await supabaseClient
      .from('profiles')
      .select('id,display_name,avatar_url')
      .in('id', actorIds);

    if (actorError) throw actorError;

    actorMap = new Map(actors.map(actor => [actor.id, actor]));
  }

  for (const notice of data) {
    const actor = actorMap.get(notice.actor_user_id);
    const actorName = actor?.display_name || '匿名會員';

    let message = '在你的文章留言';

    if (notice.notification_type === 'post_liked') {
      message = '對你的文章按讚';
    } else if (notice.notification_type === 'comment_liked') {
      message = '對你的留言按讚';
    }

    const button = action(
      (notice.is_read ? '' : '未讀｜') +
      (notice.posts?.title ?? '文章') +
      '｜' +
      actorName +
      ' ' +
      message,
      async () => {
        const { error } = await supabaseClient
          .from('forum_notifications')
          .update({ is_read: true })
          .eq('id', notice.id);

        if (error) throw error;

        button.textContent = button.textContent.replace(/^未讀｜/, '');
        refreshNoticeBadge();

        const { data: post, error: postError } = await supabaseClient
          .from('posts')
          .select('id,title,body,board,created_at,user_id')
          .eq('id', notice.post_id)
          .maybeSingle();

        if (postError) throw postError;

        if (post) {
          await showComments(post);
        } else {
          row.append(element('span', '這篇文章目前無法查看。', 'small-note'));
        }
      }
    );

    const row = element('p', '');
    row.append(button);
    inbox.append(row);
  }
}

  document.getElementById('noticeBtn').addEventListener('click', openNotificationsPage);

  if (supabaseClient) {
    initialBoardLoad = loadBoardLabels().then(() => {
      if (postList.children.length) return loadMemberPosts();
    }).catch(() => {
      feedMessage.textContent = '看板資料暫時無法載入，請重新整理。';
    });
    refreshMembership();
  } else feedMessage.textContent = '論壇服務載入失敗，請重新整理。';
</script>
